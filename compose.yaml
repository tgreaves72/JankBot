services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the actual HTTPS public origin}
      DEMO_CONFIG: /app/config/demo-access.json
      DEMO_USAGE_PATH: /app/state/demo-usage.json
    depends_on:
      - ollama
    volumes:
      - card-data:/app/data
      - demo-state:/app/state
      - ${DEMO_CONFIG_FILE:?Set the employer access config file}:/app/config/demo-access.json:ro
volumes:
  ollama-models:
  card-data:
  demo-state:
